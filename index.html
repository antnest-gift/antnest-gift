<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antnest Gift - Quản lý đơn hàng</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#173f63;--bg:#f4f7fa;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial;color:#172536}header{background:var(--navy);color:white;padding:15px 22px;display:flex;justify-content:space-between;align-items:center}button{border:0;border-radius:8px;padding:10px 14px;background:var(--navy);color:white;cursor:pointer;font-weight:bold}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px}label{display:block;margin:12px 0 5px;font-weight:bold}.wrap{max-width:1180px;margin:22px auto;padding:0 14px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:15px}.login{max-width:420px;margin:9vh auto}.hidden{display:none!important}.layout{display:grid;grid-template-columns:210px 1fr;gap:15px}.nav button{display:block;width:100%;text-align:left;background:white;color:#173f63;margin-bottom:5px}.nav button.active{background:#eaf1f7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#eef4f8;padding:16px;border-radius:9px}.stat b{font-size:24px;display:block;color:#173f63;margin-top:8px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.secondary{background:#e7eef5;color:#173f63}.notice{padding:10px;background:#eff6ff;border-radius:8px;margin:10px 0}.error{background:#fef2f2;color:#991b1b}.ok{background:#ecfdf3;color:#067647}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px;margin-top:12px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{background:#edf3f8}@media(max-width:700px){.layout{grid-template-columns:1fr}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<header><div><b>ANTNEST GIFT</b><br><small>HỆ THỐNG QUẢN LÝ ĐƠN HÀNG</small></div><div id="userarea" class="hidden"><span id="username"></span> <button id="logout" class="secondary">Đăng xuất</button></div></header>
<section id="login" class="card login"><h2>Đăng nhập</h2><label>Email</label><input id="email" type="email"><label>Mật khẩu</label><input id="password" type="password"><div class="actions"><button id="loginbtn">Đăng nhập</button></div><div id="loginmsg"></div></section>
<main id="app" class="wrap hidden"><div class="layout"><aside class="card nav">
<button data-page="home" class="active">Tổng quan</button><button data-page="orders">Mã PO / Đơn hàng</button><button data-page="delivery">Yêu cầu giao nhận</button><button data-page="visits">Chi phí gặp khách</button><button data-page="expenses">Chi phí Admin</button><button data-page="archives">Lưu trữ hồ sơ</button></aside><section class="card"><h2 id="title">Tổng quan</h2><div id="content"></div></section></div></main>
<script>
const URL="https://upivzgkmebxdjzdagkky.supabase.co";
const KEY="sb_publishable_fV5Ax1jPvQETRJkjgiosVw_oYoU8e2F";
const db=window.supabase.createClient(URL,KEY);let user=null,profile=null,page="home";
const $=x=>document.getElementById(x), esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function notice(id,s,cls="notice"){ $(id).innerHTML=`<div class="${cls}">${esc(s)}</div>`}
async function start(u){user=u;let r=await db.from("profiles").select("*").eq("id",u.id).single();if(r.error){notice("loginmsg","Không tìm thấy hồ sơ người dùng. Báo quản lý kiểm tra.","error");return}profile=r.data;$("login").classList.add("hidden");$("app").classList.remove("hidden");$("userarea").classList.remove("hidden");$("username").textContent=profile.full_name||u.email;render()}
$("loginbtn").onclick=async()=>{let r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)notice("loginmsg",r.error.message,"error");else start(r.data.user)};
$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
db.auth.getSession().then(r=>{if(r.data.session)start(r.data.session.user)});
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x===b));render()});
const f=(label,name,type="text",req=false)=>`<div><label>${label}</label><input name="${name}" type="${type}" ${req?"required":""}></div>`;
const sel=(label,name,values)=>`<div><label>${label}</label><select name="${name}">${values.map(v=>`<option>${v}</option>`).join("")}</select></div>`;
function shell(title,fields){return `<div class="card"><h3>${title}</h3><form id="entry"><div class="formgrid">${fields}</div><div class="actions"><button>Lưu thông tin</button><button type="reset" class="secondary">Nhập lại</button></div></form><div id="formmsg"></div></div>`}
async function table(name,cols){let r=await db.from(name).select("*").order("created_at",{ascending:false}).limit(100);if(r.error)return `<div class="notice error">${esc(r.error.message)}</div>`;if(!r.data.length)return `<p>Chưa có dữ liệu.</p>`;return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead><tbody>${r.data.map(row=>`<tr>${cols.map(c=>`<td>${esc(row[c[0]])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
async function render(){
const titles={home:"Tổng quan",orders:"Mã PO / Đơn hàng",delivery:"Yêu cầu giao nhận",visits:"Chi phí gặp khách",expenses:"Chi phí Admin",archives:"Lưu trữ hồ sơ"};$("title").textContent=titles[page];
if(page==="home"){let counts=await Promise.all(["orders","delivery_requests","archives"].map(t=>db.from(t).select("id",{count:"exact",head:true})));$("content").innerHTML=`<div class="grid"><div class="stat">Tổng đơn hàng<b>${counts[0].count||0}</b></div><div class="stat">Yêu cầu giao nhận<b>${counts[1].count||0}</b></div><div class="stat">Hồ sơ lưu trữ<b>${counts[2].count||0}</b></div></div><div class="notice">Đã kết nối cơ sở dữ liệu Antnest Gift. Dữ liệu hiển thị tùy theo các bản ghi đã nhập.</div>${await table("orders",[["po_code","Mã PO"],["customer_name","Khách hàng"],["sales_name","Sales"],["status","Trạng thái"]])}`;return}
let cfg={
orders:{t:"orders",fields:f("Tên khách hàng","customer_name","text",true)+f("Tên sales","sales_name")+f("Ngày đặt","order_date","date")+sel("Trạng thái","status",["Đang xử lý","Đã xác nhận","Đang sản xuất","Hoàn thành","Đã hủy"])+`<div class="full"><label>Ghi chú</label><textarea name="note"></textarea></div>`,cols:[["po_code","Mã PO"],["customer_name","Khách hàng"],["sales_name","Sales"],["status","Trạng thái"],["order_date","Ngày đặt"]]},
delivery:{t:"delivery_requests",fields:f("Ngày yêu cầu","request_date","date")+f("Người yêu cầu","requester")+f("Loại hồ sơ","document_type")+f("Tên khách hàng","customer_name")+f("Hình thức giao","delivery_method")+f("Địa chỉ","address")+f("Tên người nhận","receiver_name")+f("SĐT người nhận","receiver_phone")+sel("Trạng thái","status",["Chờ xử lý","Đang giao","Giao thành công","Thất bại"])+f("Chi phí giao","delivery_cost","number")+f("Mã Viettel Post","viettel_post_code")+f("Mã PO liên quan","po_code"),cols:[["request_date","Ngày yêu cầu"],["requester","Người yêu cầu"],["customer_name","Khách hàng"],["status","Trạng thái"],["delivery_cost","Chi phí"]]},
visits:{t:"customer_visits",fields:f("Tên sales","sales_name")+f("Ngày gặp","visit_date","date")+f("Nội dung cuộc gặp","content")+f("Tên công ty","company_name")+f("Điểm đi","origin")+f("Điểm đến","destination")+f("Công tác phí","expense","number")+sel("Trạng thái duyệt","approval_status",["Chờ duyệt","Đã duyệt","Từ chối"])+f("Mã PO liên quan","po_code"),cols:[["visit_date","Ngày gặp"],["sales_name","Sales"],["company_name","Công ty"],["approval_status","Duyệt"],["expense","Chi phí"]]},
expenses:{t:"admin_expenses",fields:f("Nội dung chi","content","text",true)+f("Ngày chi","expense_date","date")+f("Số tiền","amount","number")+f("Link chứng từ","receipt_url")+f("Mã PO liên quan","po_code")+`<div class="full"><label>Ghi chú</label><textarea name="note"></textarea></div>`,cols:[["expense_date","Ngày"],["content","Nội dung"],["amount","Số tiền"],["note","Ghi chú"]]},
archives:{t:"archives",fields:f("Ngày nhận","received_date","date")+f("Người/đơn vị giao","sender")+f("Loại hồ sơ","document_type")+f("Khách hàng","customer_name")+f("Số lượng","quantity","number")+f("Tình trạng khi nhận","receiving_condition")+sel("Trạng thái","status",["Đã lưu trữ","Chờ bổ sung","Đang xử lý"])+f("Link file","file_url")+f("Mã PO liên quan","po_code"),cols:[["received_date","Ngày nhận"],["sender","Người giao"],["customer_name","Khách hàng"],["status","Trạng thái"],["file_url","Link file"]]}
}[page];
$("content").innerHTML=shell("Thêm thông tin",cfg.fields)+"<h3>Danh sách gần đây</h3>"+await table(cfg.t,cfg.cols);
$("entry").onsubmit=async ev=>{ev.preventDefault();let row=Object.fromEntries(new FormData(ev.target).entries());row.created_by=user.id;
if(row.po_code){let q=await db.from("orders").select("id").eq("po_code",row.po_code.trim()).maybeSingle();if(q.data)row.po_id=q.data.id;delete row.po_code}
["delivery_cost","expense","amount","quantity"].forEach(k=>{if(row[k]==="")delete row[k];else if(row[k]!=null)row[k]=Number(row[k])});
let r=await db.from(cfg.t).insert(row);if(r.error)notice("formmsg",r.error.message,"error");else{notice("formmsg","Đã lưu thành công.","ok");render()}
};
}
</script></body></html>
